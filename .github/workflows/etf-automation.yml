name: ETF signal automation

on:
  schedule:
    - cron: "20 7 * * 1-5"
    - cron: "35 1 * * 1-5"
  workflow_dispatch:
    inputs:
      task:
        description: Task to run
        required: true
        default: scan
        type: choice
        options:
          - scan
          - remind

permissions:
  contents: write

concurrency:
  group: etf-signal-automation
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      SCAN_MAX_WORKERS: "12"
      MAX_SCAN_ETFS: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Choose task
        id: task
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.task }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "35 1 * * 1-5" ]; then
            echo "value=remind" >> "$GITHUB_OUTPUT"
          else
            echo "value=scan" >> "$GITHUB_OUTPUT"
          fi

      - run: python -m src.jobs.daily_signal "${{ steps.task.outputs.value }}"

      - name: Commit & push DB + signal snapshot
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/portfolio_db/ || true
          git add src/data/etf_universe.json || true
          git add latest_signal.json || true
          git diff --cached --quiet || git commit -m "auto: update portfolio DB & signals [skip ci]"
          git push
